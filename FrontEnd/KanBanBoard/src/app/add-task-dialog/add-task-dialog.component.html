<h2 mat-dialog-title>Add New Task</h2>
<mat-dialog-content>
  <mat-form-field appearance="fill">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="name">
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Description</mat-label>
    <input matInput [(ngModel)]="description">
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Points</mat-label>
    <input matInput type="number" [(ngModel)]="points">
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Date</mat-label>
    <input matInput [matDatepicker]="picker" [(ngModel)]="date" (ngModelChange)="onDateChange($event)">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>State</mat-label>
    <mat-select [(ngModel)]="state">
      <mat-option *ngIf="boardType === 'content'" value="video">Video</mat-option>
      <mat-option *ngIf="boardType === 'content'" value="uploaded">Uploaded</mat-option>
      <mat-option *ngIf="boardType !== 'content'" value="backlog">Backlog</mat-option>
      <mat-option *ngIf="boardType !== 'content'" value="ready to work">Ready To Work</mat-option>
      <mat-option *ngIf="boardType !== 'content'" value="in progress">In Progress</mat-option>
      <mat-option *ngIf="boardType !== 'content'" value="blocked">Blocked</mat-option>
      <mat-option *ngIf="boardType !== 'content'" value="in review">In Review</mat-option>
      <mat-option *ngIf="boardType !== 'content'" value="done">Done</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Priority</mat-label>
    <mat-select [(ngModel)]="priority">
      <mat-option [value]="0">None</mat-option>
      <mat-option [value]="1">Lowest</mat-option>
      <mat-option [value]="2">Low</mat-option>
      <mat-option [value]="3">Medium</mat-option>
      <mat-option [value]="4">High</mat-option>
      <mat-option [value]="5">Highest</mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onSave()">Save</button>
</mat-dialog-actions>
