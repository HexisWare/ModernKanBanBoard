<div class="board-header">
  <button mat-raised-button (click)="back()">
    <mat-icon>arrow_back</mat-icon>
    Back
  </button>
  <h2 class="board-title">{{ projectName }}</h2>
  <span class="board-type-label" [class.content-label]="boardType === 'content'">
    {{ boardType === 'content' ? 'Content Board' : 'Project Board' }}
  </span>
  <button mat-raised-button matTooltip="Import Tasks" (click)="importTasks()">
    <mat-icon>file_upload</mat-icon>
    Import
  </button>
</div>

<!-- Project Board Swimlanes -->
<div *ngIf="boardType === 'project'" class="columns-container" cdkDropListGroup>
  <div class="column" id="readyToWorkTasks" cdkDropList [cdkDropListData]="readyToWorkTasks" [cdkDropListConnectedTo]="allListIds" (cdkDropListDropped)="drop($event)">
    <h3>Ready To Work</h3>
    <div *ngFor="let task of readyToWorkTasks" cdkDrag>
      <app-task-list-card [task]="task" (increasePriority)="onIncreaseTaskPriority($event)" (decreasePriority)="onDecreaseTaskPriority($event)" (deleteTask)="onDeleteTask($event)"></app-task-list-card>
    </div>
  </div>
  <div class="column" id="inProgressTasks" cdkDropList [cdkDropListData]="inProgressTasks" [cdkDropListConnectedTo]="allListIds" (cdkDropListDropped)="drop($event)">
    <h3>In Progress</h3>
    <div *ngFor="let task of inProgressTasks" cdkDrag>
      <app-task-list-card [task]="task" (increasePriority)="onIncreaseTaskPriority($event)" (decreasePriority)="onDecreaseTaskPriority($event)" (deleteTask)="onDeleteTask($event)"></app-task-list-card>
    </div>
  </div>
  <div class="column" id="blockedTasks" cdkDropList [cdkDropListData]="blockedTasks" [cdkDropListConnectedTo]="allListIds" (cdkDropListDropped)="drop($event)">
    <h3>Blocked</h3>
    <div *ngFor="let task of blockedTasks" cdkDrag>
      <app-task-list-card [task]="task" (increasePriority)="onIncreaseTaskPriority($event)" (decreasePriority)="onDecreaseTaskPriority($event)" (deleteTask)="onDeleteTask($event)"></app-task-list-card>
    </div>
  </div>
  <div class="column" id="inReviewTasks" cdkDropList [cdkDropListData]="inReviewTasks" [cdkDropListConnectedTo]="allListIds" (cdkDropListDropped)="drop($event)">
    <h3>In Review</h3>
    <div *ngFor="let task of inReviewTasks" cdkDrag>
      <app-task-list-card [task]="task" (increasePriority)="onIncreaseTaskPriority($event)" (decreasePriority)="onDecreaseTaskPriority($event)" (deleteTask)="onDeleteTask($event)"></app-task-list-card>
    </div>
  </div>
  <div class="column" id="doneTasks" cdkDropList [cdkDropListData]="doneTasks" [cdkDropListConnectedTo]="allListIds" (cdkDropListDropped)="drop($event)">
    <h3>Done</h3>
    <div *ngFor="let task of doneTasks" cdkDrag>
      <app-task-list-card [task]="task" (increasePriority)="onIncreaseTaskPriority($event)" (decreasePriority)="onDecreaseTaskPriority($event)" (deleteTask)="onDeleteTask($event)"></app-task-list-card>
    </div>
  </div>
</div>

<div *ngIf="boardType === 'project'" class="large-box" id="backlogTasks" cdkDropList [cdkDropListData]="backlogTasks" [cdkDropListConnectedTo]="allListIds" (cdkDropListDropped)="drop($event)">
  <button mat-fab matTooltip="Add Task" color="primary" (click)="addTask()">
    <mat-icon>add</mat-icon>
  </button>
  <h3>Backlog</h3>
  <div *ngFor="let task of backlogTasks" cdkDrag>
    <app-task-list-card [task]="task"></app-task-list-card>
  </div>
</div>

<!-- Content Board Swimlanes -->
<div *ngIf="boardType === 'content'" class="columns-container content-board" cdkDropListGroup>
  <div class="column content-column" id="videoTasks" cdkDropList [cdkDropListData]="videoTasks" [cdkDropListConnectedTo]="allListIds" (cdkDropListDropped)="drop($event)">
    <h3>Video</h3>
    <div *ngFor="let task of videoTasks" cdkDrag>
      <app-task-list-card [task]="task" (increasePriority)="onIncreaseTaskPriority($event)" (decreasePriority)="onDecreaseTaskPriority($event)" (deleteTask)="onDeleteTask($event)"></app-task-list-card>
    </div>
  </div>
  <div class="column content-column" id="uploadedTasks" cdkDropList [cdkDropListData]="uploadedTasks" [cdkDropListConnectedTo]="allListIds" (cdkDropListDropped)="drop($event)">
    <h3>Uploaded</h3>
    <div *ngFor="let task of uploadedTasks" cdkDrag>
      <app-task-list-card [task]="task" (increasePriority)="onIncreaseTaskPriority($event)" (decreasePriority)="onDecreaseTaskPriority($event)" (deleteTask)="onDeleteTask($event)"></app-task-list-card>
    </div>
  </div>
</div>

<div *ngIf="boardType === 'content'" class="large-box">
  <button mat-fab matTooltip="Add Task" color="primary" (click)="addTask()">
    <mat-icon>add</mat-icon>
  </button>
</div>
