<h2 mat-dialog-title>Add New Project</h2>
<mat-dialog-content>
  <mat-form-field appearance="fill">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="name">
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Description</mat-label>
    <input matInput [(ngModel)]="description">
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Board Type</mat-label>
    <mat-select [(ngModel)]="boardType">
      <mat-option value="project">Project Board</mat-option>
      <mat-option value="content">Content Board</mat-option>
      <mat-option value="gamedev">GameDev Board</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Priority</mat-label>
    <mat-select [(ngModel)]="priority">
      <mat-option [value]="0">None</mat-option>
      <mat-option [value]="1">Lowest</mat-option>
      <mat-option [value]="2">Low</mat-option>
      <mat-option [value]="3">Medium</mat-option>
      <mat-option [value]="4">High</mat-option>
      <mat-option [value]="5">Highest</mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onSave()">Save</button>
</mat-dialog-actions>
